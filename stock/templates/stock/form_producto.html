{% extends 'stock/base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow border-0 p-4">
            <h2 class="fw-bold mb-4 text-dark">Registrar Nuevo Producto</h2>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">Modelo</label>
                    <select name="nombre" class="form-select" required>
                        <option value="" selected disabled>Seleccione el modelo</option>
                        <option value="Zapatilla">Zapatilla</option>
                        <option value="Sandalia">Sandalia</option>
                        <option value="Escolar">Escolar</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">SKU</label>
                    <input type="text" name="sku" class="form-control" placeholder="Ej. ZAP-001" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Talla</label>
                    <select name="talla" class="form-select" required>
                        <option value="" selected disabled>Seleccione el rango de talla</option>
                        <option value="21-27">21-27</option>
                        <option value="28 - 38">28 - 38</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Stock Inicial</label>
                    <input type="number" name="stock" class="form-control" min="0" placeholder="Ej. 10" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Precio ($)</label>
                    <input type="number" step="0.01" name="precio" class="form-control" placeholder="Ej. 29990" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold d-block">Bodega de Origen (Selección)</label>
                    <div class="p-3 border rounded bg-light">
                        {% for bodega in bodegas %}
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="bodega" id="bodega_{{ bodega.id }}" value="{{ bodega.id }}" {% if forloop.first %}required{% endif %}>
                            <label class="form-check-label fw-medium" for="bodega_{{ bodega.id }}">
                                {{ bodega.nombre }} {% if bodega.ubicacion %}({{ bodega.ubicacion }}){% endif %}
                            </label>
                        </div>
                        {% empty %}
                        <p class="text-danger mb-0">No hay bodegas registradas. Por favor crea una bodega primero.</p>
                        {% endfor %}
                    </div>
                </div>

                <div class="d-grid gap-2 mb-3">
                    <button type="submit" class="btn btn-primary btn-lg">Guardar Producto</button>
                </div>

                <div class="text-center">
                    <a href="{% url 'lista_productos' %}" class="text-decoration-none text-muted">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
