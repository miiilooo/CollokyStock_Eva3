<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Modificada - COLLOKY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                
                <!-- Notificación / Alerta de éxito -->
                <div class="alert alert-success alert-dismissible fade show shadow-sm mb-4 text-center py-3" role="alert">
                    <i class="bi bi-check-circle-fill fs-3 d-block mb-1"></i>
                    <strong>¡Contraseña actualizada con éxito!</strong>
                    <div class="small mt-1">Los cambios se han guardado correctamente en el sistema.</div>
                </div>

                <div class="card shadow border-0 p-4 text-center">
                    <h4 class="fw-bold mb-3 text-dark">Ya puedes iniciar sesión</h4>
                    <p class="text-muted small mb-4">Tu clave de acceso ha sido modificada en la base de datos. Utiliza tus nuevas credenciales para ingresar al panel de control.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100">Ir al inicio de sesión</a>
                </div>

            </div>
        </div>
    </div>

<!-- Script global de validación de SKU y campos obligatorios -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const skuInputs = document.querySelectorAll('input[name="sku"], input[id*="sku"], input[id*="SKU"]');
    skuInputs.forEach(skuInput => {
        skuInput.setAttribute('maxlength', '9');
        skuInput.setAttribute('placeholder', '123456-78');
        skuInput.setAttribute('required', 'required');
        
        skuInput.addEventListener('beforeinput', function(e) {
            if (e.data && /[^0-9]/.test(e.data)) {
                e.preventDefault();
            }
        });

        skuInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 6) {
                value = value.slice(0, 6) + '-' + value.slice(6, 8);
            }
            e.target.value = value;
        });
    });
});
</script>

<!-- script-sku-mask -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const forms = document.querySelectorAll('form');
    forms.forEach(form => {
        const skuInput = form.querySelector('input[name="sku"], input[id*="sku"]');
        if (skuInput) {
            skuInput.setAttribute('maxlength', '9');
            skuInput.setAttribute('placeholder', '123456-78');
            skuInput.setAttribute('required', 'required');
            skuInput.setAttribute('pattern', '\\d{6}-\\d{2}');

            skuInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 6) {
                    value = value.slice(0, 6) + '-' + value.slice(6, 8);
                }
                e.target.value = value;
            });

            form.addEventListener('submit', function(e) {
                const val = skuInput.value.trim();
                const regex = /^\d{6}-\d{2}$/;
                if (!regex.test(val)) {
                    e.preventDefault();
                    alert('Error: El SKU es obligatorio y debe cumplir estrictamente con el formato XXXXXX-XX (ej: 123456-78).');
                    skuInput.focus();
                }
            });
        }
    });
});
</script>

<!-- script-campos-requeridos -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const fieldsToCheck = ['stock', 'precio', 'bodega', 'quantity', 'price', 'warehouse', 'stock_actual', 'precio_venta', 'cantidad'];
    fieldsToCheck.forEach(name => {
        const field = document.querySelector('input[name="' + name + '"], select[name="' + name + '"]');
        if (field) {
            field.setAttribute('required', 'required');
        }
    });
});
</script>
</body>



</html>
